<script>
// All business data is requested through fetch(). The role selector is a DEMO ONLY,
// not a real login. Production work must use authenticated sessions + a database.
const $=(x,root=document)=>root.querySelector(x);
const safe=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const num=x=>Number(x||0).toLocaleString('en-PK');
const cash=x=>'Rs. '+num(x);

function dispatchPage(){
 let stages=[['Approved','approved'],['Assigned','assigned'],['Filled','filled'],['On the way','en_route'],['Arrived','arrived']];
 return `${heading('Hydrant operations','Dispatch board','Assign vehicles, fill tankers and record their departure.',`<button class="btn btn-soft" data-page="resources">${I('settings',16)} Hydrant & fleet status</button>`)}
 <div class="notice">${I('shield',17)} Only available tankers and drivers with matching capacity can be assigned. Overlapping trip windows are blocked by the API.</div>
 <div class="board">${stages.map(([label,s])=>{let bs=myBookings().filter(b=>b.status===s);return `<section class="board-col"><div class="board-head"><span>${safe(label)}</span><span class="pill-count">${bs.length}</span></div>${bs.length?bs.map(b=>`<div class="task"><span class="eyebrow" style="margin:0">${safe(b.id)}</span><h3>${safe(name('users',b.customer))}</h3><p style="font-size:11px">${pretty(b.date)} · ${safe(b.slot)}–${slotEnd(b.slot)}</p><p style="font-size:11px">${num(b.capacity)} gallons</p>${b.tanker?`<p style="margin-top:5px;font-size:11px">Vehicle: ${safe(rel('tankers',b.tanker)?.plate||'—')}</p>`:''}${buttons(b)}</div>`).join(''):`<div class="empty" style="padding:27px 8px">${I('check',23)}<p>No bookings</p></div>`}</section>`}).join('')}</div>${panel('Your assigned hydrant','Daily water allocation',quotas())}`;
}
function resourcesPage(){
 // The API only gives operators records for their assigned hydrant.
 const h=S.data.hydrants.find(x=>x.id===me().hydrant);
 const cars=S.data.tankers.filter(t=>t.hydrant===me().hydrant);
 if(!h)return `${heading('Hydrant operations','Hydrant & fleet','This operator has no assigned hydrant.')}${empty('No assigned hydrant','Ask the administrator to assign a hydrant to this account.')}`;
 const control=(kind,x)=>`<div class="admin-line resource-control"><div><strong>${safe(x.name||x.plate)}</strong><div><span>${kind==='hydrant'?num(x.quota)+' gallons daily · '+String(h.open).padStart(2,'0')+':00–'+String(h.close).padStart(2,'0')+':00':num(x.capacity)+' gallon tanker'}</span></div><div style="margin-top:8px">${x.active?'<span class="tag green">Available</span>':'<span class="tag red">Unavailable</span>'}</div></div><button type="button" class="btn ${x.active?'btn-soft':'btn-primary'} btn-small" data-do="operator-toggle" data-kind="${kind}" data-id="${safe(x.id)}" data-active="${String(!x.active)}" aria-label="${x.active?'Mark unavailable':'Mark available'}: ${safe(x.name||x.plate)}">${x.active?'Mark unavailable':'Mark available'}</button></div>`;
 return `${heading('Hydrant operations','Hydrant & fleet availability','Switch your assigned hydrant or tankers on and off without administrator access.')}
 <div class="notice">${I('shield',18)} When a hydrant is unavailable, new bookings and assignments are blocked. An unavailable tanker cannot be newly assigned. Trips already dispatched remain in the records.</div>
 <div class="admin-grid">
 ${panel('Your assigned hydrant','Available or temporarily out of service',control('hydrant',h))}
 ${panel('Your registered tankers',cars.length+' vehicles at this hydrant',cars.length?cars.map(t=>control('tanker',t)).join(''):empty('No tankers registered','Ask an administrator to register tankers for this hydrant.'))}
 </div>${panel('Water quota today','Reserved water against your hydrant daily quota',quotas())}`;
}
function tripsPage(){let bs=myBookings().slice().reverse();return `${heading('Driver workspace','My assigned trips','Driver-friendly delivery updates, even on a small phone screen.')}
 <div class="trip-grid">${bs.length?bs.map(b=>`<article class="trip"><div class="list-head"><span class="eyebrow" style="margin:0">Trip ${safe(b.id)}</span>${badge(b.status)}</div><h3>${safe(name('users',b.customer))}</h3><div class="address">${I('pin',18)} ${safe(rel('users',b.customer)?.address||name('zones',b.zone))}</div><div class="trip-details"><div><span>Delivery window</span><strong>${pretty(b.date)} · ${safe(b.slot)}</strong></div><div><span>Tanker</span><strong>${safe(rel('tankers',b.tanker)?.plate||'Not assigned')}</strong></div><div><span>Water</span><strong>${num(b.capacity)} gallons</strong></div><div><span>Hydrant</span><strong>${safe(name('hydrants',b.hydrant))}</strong></div></div>${buttons(b)}<button class="link" data-do="detail" data-id="${safe(b.id)}">View booking details ${I('arrow',14)}</button></article>`).join(''):empty('No trips assigned','Your operator can assign an approved booking to you.')}</div>`;
}
function adminPage(){
 const rate=(type,label)=>`<form class="admin-line" data-admin="rate"><div><strong>${label}</strong><div><span>Per 1,000 gallons (PKR)</span></div></div><input type="hidden" name="name" value="${type}"><input type="number" name="value" value="${Number(S.data.settings[type])}" min="1" required aria-label="${label} rate"><button class="btn btn-soft btn-small" type="submit">Save</button></form>`;
 const quota=(h)=>`<form class="admin-line" data-admin="quota"><div><strong>${safe(h.name)}</strong><div><span>${safe(name('zones',h.zone))}</span></div></div><input type="hidden" name="id" value="${safe(h.id)}"><input type="number" name="value" value="${Number(h.quota)}" min="1000" step="1000" required aria-label="Daily quota for ${safe(h.name)}"><button class="btn btn-soft btn-small" type="submit">Save</button></form>`;
 const toggle=(kind,x)=>`<div class="admin-line"><div><strong>${safe(x.name||x.plate)}</strong><div><span>${kind==='hydrant'?num(x.quota)+' gal/day':num(x.capacity)+' gallons'} · ${x.active?'Available':'Unavailable'}</span></div></div><button class="btn btn-soft btn-small" data-do="toggle" data-kind="${kind}" data-id="${safe(x.id)}">${x.active?'Set unavailable':'Set available'}</button></div>`;
 return `${heading('Administration','System management','Maintain official mock water rates, resources and staff assignments.')}
 <div class="admin-grid">
 ${panel('Water rates','Applies to new bookings',rate('commercial','Commercial price')+rate('subsidized','Subsidized price'))}
 ${panel('Daily hydrant quotas','Gallons available per day',S.data.hydrants.map(quota).join(''))}
 ${panel('Hydrant availability','Temporarily enable or disable a hydrant',S.data.hydrants.map(h=>toggle('hydrant',h)).join(''))}
 ${panel('Fleet availability','Manage tanker availability',S.data.tankers.map(t=>toggle('tanker',t)).join(''))}
 </div>
 <section class="card" style="margin-top:18px"><header class="card-head"><div><h2>Add service resources</h2><p>Use these small forms to add zones, hydrants, tankers and staff</p></div></header><div class="card-body"><div class="admin-grid">
 <form data-admin="zone"><h3 style="margin-bottom:12px">Add service zone</h3><div class="field"><label for="zname">Zone name</label><input name="name" id="zname" required placeholder="e.g. Korangi"></div><button type="submit" class="btn btn-primary btn-small">${I('plus',15)} Add zone</button></form>
 <form data-admin="hydrant"><h3 style="margin-bottom:12px">Add hydrant</h3><div class="field"><label for="hname">Hydrant name</label><input name="name" id="hname" required placeholder="e.g. Korangi Water Point"></div><div class="field"><label for="hzone">Serving zone</label><select id="hzone" name="zone" required>${opts(S.data.zones.map(z=>[z.id,z.name]))}</select></div><div class="field"><label for="hquota">Daily quota (gal)</label><input id="hquota" type="number" name="quota" min="1000" step="1000" value="15000" required></div><button type="submit" class="btn btn-primary btn-small">${I('plus',15)} Add hydrant</button></form>
 <form data-admin="tanker"><h3 style="margin-bottom:12px">Add tanker</h3><div class="field"><label for="tname">Registration plate</label><input id="tname" name="name" required placeholder="e.g. KHI-3040"></div><div class="field"><label for="thydrant">Assigned hydrant</label><select name="hydrant" id="thydrant" required>${opts(S.data.hydrants.map(h=>[h.id,h.name]))}</select></div><div class="field"><label for="tcapacity">Capacity</label><select name="capacity" id="tcapacity">${opts(capacityOptions)}</select></div><button type="submit" class="btn btn-primary btn-small">${I('plus',15)} Add tanker</button></form>
 <form data-admin="user"><h3 style="margin-bottom:12px">Add staff member</h3><div class="field"><label for="uname">Full name</label><input name="name" id="uname" required placeholder="e.g. Ali Abbas"></div><div class="field"><label for="urole">Staff role</label><select name="role" id="urole"><option value="officer">Zone officer</option><option value="operator">Hydrant operator</option><option value="driver">Driver</option></select></div><div class="field"><label for="uzone">Assigned zone (officer)</label><select id="uzone" name="zone">${opts(S.data.zones.map(z=>[z.id,z.name]))}</select></div><div class="field"><label for="uhydrant">Assigned hydrant (operator/driver)</label><select id="uhydrant" name="hydrant">${opts(S.data.hydrants.map(h=>[h.id,h.name]))}</select></div><button type="submit" class="btn btn-primary btn-small">${I('plus',15)} Add staff</button></form>
 </div></div></section>`;
}
function reportsPage(){let list=myBookings(),groups={};for(const b of list)groups[b.status]=(groups[b.status]||0)+1;let max=Math.max(1,...Object.values(groups));return `${heading('Management insights','Reports & analytics','Booking totals are calculated from mock API records, not typed into the page.')}
 <div class="stats">${stat('City bookings',num(list.length),'book','','All service zones')}${stat('Gross billings',cash(S.data.totals.billed),'file','green','Demo amounts only')}${stat('Active requests',num(S.data.totals.active),'truck','orange','Waiting or in motion')}${stat('Delivered',num(S.data.totals.delivered),'check','lilac','Completed deliveries')}</div>
 <div class="cols">${panel('Booking status breakdown','Count by latest recorded status',Object.entries(groups).map(([key,n])=>`<div class="quota"><div class="quota-line"><b>${safe(labels[key]||key)}</b><span>${n} bookings</span></div><div class="track"><div class="bar" style="width:${Math.round(n/max*100)}%"></div></div></div>`).join(''))}${panel('Water supply overview','Active hydrant allocation',quotas())}</div>`;
}
function view(){let r=me().role,allow=menus[r].some(x=>x[0]===S.page);if(!allow)S.page='home';switch(S.page){case 'home':return home();case 'book':return bookingPage();case 'bookings':return bookingsPage();case 'bills':return billsPage();case 'subsidy':return subsidyPage();case 'approvals':return approvalPage();case 'applications':return applicationsPage();case 'disputes':return disputesPage();case 'dispatch':return dispatchPage();case 'resources':return resourcesPage();case 'trips':return tripsPage();case 'admin':return adminPage();case 'reports':return reportsPage();default:return home()}}
function render(){if(!S.data)return;let user=me(),r=user.role;let pages=menus[r]||menus.customer;
 $('#app').innerHTML=`<div class="shell"><aside class="sidebar ${S.menu?'open':''}"><div class="brand"><span class="logo">${I('drop',29)}</span><div><strong>PaaniLink</strong><small>WATER MANAGEMENT</small></div></div><div class="menu-label">Workspace</div><nav aria-label="Main navigation">${pages.map(([id,title,icon])=>`<button class="nav ${S.page===id?'active':''}" data-page="${id}" ${S.page===id?'aria-current="page"':''}>${I(icon)} ${safe(title)}</button>`).join('')}</nav><div class="side-bottom"><div class="help-box"><b>Every drop matters.</b><p>Clear bookings, fair water allocation and dependable delivery updates.</p><span>PaaniLink student prototype</span></div><div class="small-mark">Built for Web Engineering · v1.0</div></div></aside>
 ${S.menu?`<button class="mobile-curtain show" data-do="toggle-menu" aria-label="Close menu"></button>`:''}
 <div class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" data-do="toggle-menu" aria-label="Open navigation">${I('menu',21)}</button><div class="crumb">PaaniLink <span>/</span> <strong>${safe(pages.find(x=>x[0]===S.page)?.[1]||'Dashboard')}</strong></div></div><div class="top-actions"><span class="top-chip"><i class="dot"></i> Demo API ready</span><label class="sr-only" for="userPicker">Demo account</label><select class="user-select" id="userPicker">${opts(S.data.demoUsers.map(u=>[u.id,`${u.name} · ${roleNames[u.role]}`]),S.user)}</select><div class="avatar">${safe(user.name.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase())}</div></div></header><main class="content" id="content">${view()}<footer class="footer"><span>© PaaniLink · Water delivery management</span><span>Semester project · Demo information only · <button class="link" data-do="register">Create customer</button></span></footer></main></div></div>${S.modal||''}`;
}
async function api(endpoint,body,method){const res=await fetch('/api/'+endpoint,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json','X-Demo-User':S.user},body:body?JSON.stringify(body):undefined});const value=await res.json();if(!res.ok)throw new Error(value.error||'Request failed.');return value;}
async function reload(){S.data=await api('state');render();}
function toast(txt,error=false){let box=document.createElement('div');box.className='toast'+(error?' error':'');box.textContent=txt;$('#toasts').append(box);setTimeout(()=>box.remove(),4300)}
function goto(page){S.page=page;S.menu=false;S.modal=null;location.hash=page;render();window.scrollTo(0,0)}
async function mutate(url,body,message,page){try{await api(url,body);S.modal=null;await reload();if(page)goto(page);toast(message||'Saved successfully.');return true}catch(e){toast(e.message,true);return false}}
function updatePrice(){let amount=Number($('#capacity')?.value||1000),type=$('input[name="type"]:checked')?.value||'commercial';if($('#estimate'))$('#estimate').textContent=cash(amount/1000*(S.data.settings[type]||0));if($('#estimate-text'))$('#estimate-text').textContent=type==='subsidized'?'Subsidized · needs officer approval':'Commercial · approved after quota check';}
function setSlots(){let hyd=rel('hydrants',$('#hydrant')?.value);if($('#slot'))$('#slot').innerHTML=opts(timeOptions(hyd));}
function modal(content){S.modal=`<div class="modal-shade" id="shade"><section class="modal" role="dialog" aria-modal="true" aria-label="Booking action"><div class="modal-head"><h2>Action details</h2><button class="close" data-do="close" aria-label="Close">${I('x',18)}</button></div>${content}</section></div>`;render();$('.modal input,.modal select,.modal textarea')?.focus();}
function detail(id){let b=myBookings().find(x=>x.id===id);if(!b)return;modal(`<span class="eyebrow">Booking · ${safe(b.id)}</span><div class="list-head"><h2 style="margin:7px 0">Delivery details</h2>${badge(b.status)}</div><div class="trip-details" style="margin-top:20px"><div><span>Customer</span><strong>${safe(name('users',b.customer))}</strong></div><div><span>Hydrant</span><strong>${safe(name('hydrants',b.hydrant))}</strong></div><div><span>Date and time</span><strong>${pretty(b.date)} · ${safe(b.slot)}</strong></div><div><span>Water</span><strong>${num(b.capacity)} gal</strong></div><div><span>Assigned tanker</span><strong>${safe(rel('tankers',b.tanker)?.plate||'Not assigned')}</strong></div><div><span>Driver</span><strong>${safe(name('users',b.driver))}</strong></div></div><div class="notice"><strong>Booking amount:</strong> ${cash(b.amount)}</div>${b.reason?`<div class="notice warn">Reported issue: ${safe(b.reason)}</div>`:''}${b.resolution?`<div class="notice good">Officer resolution: ${safe(b.resolution)}</div>`:''}${buttons(b)}<div class="form-buttons" style="margin-top:18px"><button class="btn btn-soft" data-do="close">Close</button></div>`)}
function assign(id){let b=myBookings().find(x=>x.id===id),h=S.data.hydrants.find(h=>h.id===b.hydrant);let cars=S.data.tankers.filter(t=>t.hydrant===h.id&&t.active&&t.capacity===b.capacity);let drivers=S.data.users.filter(u=>u.role==='driver'&&u.hydrant===h.id&&u.active);modal(`<span class="eyebrow">Dispatch planning</span><h2 style="margin:5px 0 10px">Assign ${safe(id)}</h2><p style="margin-bottom:18px">${num(b.capacity)} gal · ${pretty(b.date)} · ${safe(b.slot)}–${slotEnd(b.slot)}</p><form id="assignForm" data-id="${safe(id)}"><div class="field"><label for="tanker">Available tanker</label><select name="tanker" id="tanker" required>${opts(cars.map(t=>[t.id,t.plate+' · '+num(t.capacity)+' gal']))}</select></div><div class="field"><label for="driver">Available driver</label><select name="driver" id="driver" required>${opts(drivers.map(d=>[d.id,d.name]))}</select></div>${!cars.length||!drivers.length?`<div class="notice warn">No matching active vehicle or driver is configured for this hydrant.</div>`:''}<div class="form-buttons"><button class="btn btn-soft" type="button" data-do="close">Cancel</button><button class="btn btn-primary" type="submit" ${cars.length&&drivers.length?'':'disabled'}>Assign ${I('arrow',15)}</button></div></form>`)}
function askReason(id,action){let title={reject:'Reject booking',dispute:'Report a delivery issue',fail:'Report failed delivery',resolve:'Resolve a dispute','reject-subsidy':'Reject application'}[action]||'Enter reason';modal(`<span class="eyebrow">Water board decision</span><h2 style="margin:5px 0 15px">${safe(title)}</h2><form id="reasonForm" data-id="${safe(id)}" data-action="${safe(action)}"><div class="field"><label for="reason">Reason or resolution notes *</label><textarea id="reason" name="reason" required minlength="5" placeholder="Write a clear explanation..."></textarea></div><div class="form-buttons"><button type="button" class="btn btn-soft" data-do="close">Cancel</button><button class="btn btn-primary" type="submit">Submit ${I('arrow',15)}</button></div></form>`)}
function register(){modal(`<span class="eyebrow">New customer · mock registration</span><h2 style="margin:5px 0 15px">Create an account</h2><form id="registerForm"><div class="field"><label for="rname">Full name *</label><input name="name" id="rname" required minlength="3" placeholder="Your full name"></div><div class="form-grid"><div class="field"><label for="rphone">Phone *</label><input name="phone" id="rphone" required placeholder="03001234567" pattern="03[0-9]{9}"></div><div class="field"><label for="rcnic">CNIC *</label><input name="cnic" id="rcnic" required placeholder="42101-1234567-1" pattern="[0-9]{5}-[0-9]{7}-[0-9]"></div></div><div class="field"><label for="raddress">Delivery address *</label><input name="address" id="raddress" required minlength="7" placeholder="House / Street / Block"></div><div class="field"><label for="rzone">Water service zone *</label><select name="zone" id="rzone">${opts(S.data.zones.map(z=>[z.id,z.name]))}</select></div><div class="form-buttons"><button type="button" class="btn btn-soft" data-do="close">Cancel</button><button class="btn btn-primary" type="submit">Create customer</button></div></form>`)}
async function action(button){let type=button.dataset.do,id=button.dataset.id;
 if(type==='toggle-menu'){S.menu=!S.menu;render();return}
 if(type==='close'){S.modal=null;render();return}
 if(type==='detail'){detail(id);return}
 if(type==='proof'){try{let res=await fetch('/api/proof/'+encodeURIComponent(id),{headers:{'X-Demo-User':S.user}});if(!res.ok)throw new Error((await res.json()).error);let url=URL.createObjectURL(await res.blob()),a=document.createElement('a');a.href=url;a.download='PaaniLink-proof';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){toast(e.message,true)}return}
 if(type==='register'){register();return}
 if(type==='assign'){assign(id);return}
 if(['reject','dispute','fail','resolve','reject-subsidy'].includes(type)){askReason(id,type);return}
 if(type==='cancel'&&!confirm('Cancel this booking?'))return;
 if(type==='toggle')return mutate('admin',{type:'toggle',kind:button.dataset.kind,id},'Availability updated.');
 if(type==='operator-toggle'){
   const active=button.dataset.active==='true';
   if(!active&&!confirm('Mark this '+button.dataset.kind+' unavailable? New bookings or assignments using it will be blocked.'))return;
   return mutate('resource-status',{kind:button.dataset.kind,id,active},active?'Resource marked available.':'Resource marked unavailable.');
 }
 if(type==='verify'||type==='reject-subsidy')return mutate('subsidy-action',{id,action:type==='verify'?'verify':'reject'},'Subsidy updated.');
 if(['cancel','approve','fill','depart','arrive','deliver','confirm'].includes(type))return mutate('booking-action',{id,action:type},'Booking status updated.');
}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();goto(nav.dataset.page);return}
 const btn=e.target.closest('[data-do]');if(btn){e.preventDefault();action(btn);return}
 if(e.target.id==='shade'){S.modal=null;render()}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='userPicker'){S.user=e.target.value;localStorage.setItem('paanilink-user',S.user);S.page='home';S.query='';S.filter='all';S.modal=null;location.hash='home';await reload();return}
 if(e.target.id==='capacity'||e.target.name==='type')updatePrice();
 if(e.target.id==='hydrant')setSlots();
 if(e.target.id==='statusFilter'){S.filter=e.target.value;await filterBookings();}
});
document.addEventListener('input',async e=>{if(e.target.id==='query'){S.query=e.target.value;await filterBookings();}});
async function filterBookings(){try{let list=await api('bookings?status='+encodeURIComponent(S.filter)+'&q='+encodeURIComponent(S.query));if($('#tableTarget'))$('#tableTarget').innerHTML=tableWrap(list)}catch(e){toast(e.message,true)}}
const values=form=>Object.fromEntries(new FormData(form).entries());
document.addEventListener('submit',async e=>{
 let f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(!f.reportValidity())return;
 if(f.id==='bookForm'){let v=values(f);if(await mutate('booking',{...v,capacity:Number(v.capacity)},v.type==='subsidized'?'Request sent for officer approval.':'Booking created and approved.','bookings'))return;}
 if(f.id==='subsidyForm'){
   const file=$('#proofFile')?.files?.[0];if(!file||file.size>1024*1024||file.size<10||!['application/pdf','image/jpeg','image/png'].includes(file.type)){toast('Select a PDF, JPG or PNG document smaller than 1 MB.',true);return}
   try{const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('Cannot read proof file.'));reader.readAsDataURL(file)});
     const v=values(f);delete v.proofFile;await mutate('subsidy',{...v,file:{name:file.name,mime:file.type,data:encoded}},'Subsidy application sent to officer.');
   }catch(e){toast(e.message,true)}return;
 }
 if(f.id==='assignForm'){await mutate('booking-action',{id:f.dataset.id,action:'assign',...values(f)},'Tanker and driver assigned.');return}
 if(f.id==='reasonForm'){
   let action=f.dataset.action,payload={id:f.dataset.id,action,reason:values(f).reason};
   if(action==='reject-subsidy'){payload.action='reject';await mutate('subsidy-action',payload,'Subsidy application rejected.');}else await mutate('booking-action',payload,'Action recorded.');return;
 }
 if(f.id==='registerForm'){
   try{let u=await api('register',values(f));S.user=u.id;localStorage.setItem('paanilink-user',u.id);S.modal=null;S.page='home';location.hash='home';await reload();toast('Customer created successfully.');}catch(e){toast(e.message,true)}return;
 }
 if(f.dataset.admin){await mutate('admin',{...values(f),type:f.dataset.admin},'Administration changes saved.');return}
});
window.addEventListener('hashchange',()=>{let page=location.hash.slice(1)||'home';if(page!==S.page){S.page=page;S.modal=null;render()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
(async()=>{try{await reload()}catch(e){S.user='u1';try{await reload()}catch{document.querySelector('#app').innerHTML=`<div style="max-width:580px;margin:100px auto;padding:30px;text-align:center;border-radius:16px;background:white"><h1>Start PaaniLink</h1><p style="margin:15px 0 25px">Run <code>npm start</code> in the project folder, then visit <b>http://localhost:5173</b>.</p><p style="font-size:12px">The Fetch API requires the local demo server; opening the HTML file directly will not load booking data.</p></div>`}}})();
</script>
</body>
</html>
